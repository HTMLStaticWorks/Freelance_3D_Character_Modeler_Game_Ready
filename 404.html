<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Page Not Found | 3D Character Modeler</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--f-ui);
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    .ambient-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    .error-container {
      position: relative;
      z-index: 2;
      max-width: 480px;
      width: 100%;
      padding: var(--s6) var(--s4);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D-like digital Glitch Text */
    .glitch-num {
      font-family: var(--f-head);
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--c-cyan), var(--c-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 var(--s2);
      position: relative;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0,212,255,0.2)); }
      100% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(0,212,255,0.45)); }
    }

    /* Wireframe grid illustration */
    .wireframe-box {
      width: 120px;
      height: 120px;
      border: 1px dashed var(--c-cyan);
      border-radius: var(--r2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--s4);
      position: relative;
      opacity: 0.85;
      background: rgba(8, 12, 20, 0.4);
    }

    .wireframe-box::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid var(--c-violet);
      border-radius: var(--r1);
      opacity: 0.5;
    }

    .wireframe-box i {
      font-size: 2.5rem;
      color: var(--c-cyan);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }

    h1 {
      font-family: var(--f-h1);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 var(--s2);
      color: var(--c-text);
    }

    p {
      color: var(--c-text2);
      font-size: 0.88rem;
      line-height: 1.5;
      margin: 0 0 var(--s4);
    }

    .actions {
      display: flex;
      gap: var(--s2);
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .actions .btn {
      min-width: 150px;
    }

    /* Responsive overrides down to small mobiles */
    @media (max-width: 480px) {
      .glitch-num {
        font-size: 5rem;
      }
      h1 {
        font-size: 1.35rem;
      }
      p {
        font-size: 0.82rem;
      }
      .actions {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }
      .actions .btn {
        width: 100%;
        max-width: 280px;
      }
    }

    @media (max-width: 360px) {
      .glitch-num {
        font-size: 4rem;
      }
      .error-container {
        padding: var(--s4) var(--s2);
      }
      .wireframe-box {
        width: 100px;
        height: 100px;
        margin-bottom: var(--s3);
      }
      .wireframe-box i {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="error-container">
    <div class="wireframe-box">
      <i class="ri-scan-3-line"></i>
    </div>
    
    <div class="glitch-num">404</div>
    
    <h1>Coordinates Lost</h1>
    <p>The mesh or asset package you are looking for has been retopologized out of existence, or the address path is incorrect.</p>
    
    <div class="actions">
      <a href="index.html" class="btn btn-cyan"><i class="ri-home-5-line"></i> Return Home</a>
      <a href="pages/portfolio.html" class="btn btn-outline"><i class="ri-gallery-line"></i> View Portfolio</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
