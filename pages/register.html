<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Create Studio Account | Modeler Game</title>
  <!-- Times New Roman is a system font -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <style>
    .pw-wrap{position:relative;} .pw-wrap input{padding-right:46px;}
    .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--c-text3);cursor:pointer;font-size:1rem;display:flex;align-items:center;transition:var(--transition);}
    .pw-eye:hover{color:var(--c-cyan);}
    .str-track{height:3px;background:var(--c-border);border-radius:2px;margin-top:6px;overflow:hidden;}
    #strength-bar{height:100%;width:0;border-radius:2px;transition:all .3s;}
    #strength-text{font-family:var(--f-ui);font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;color:var(--c-text3);}
    
    /* RTL overrides */
    [dir="rtl"] .pw-eye {
      right: auto;
      left: 12px;
    }
    [dir="rtl"] .pw-wrap input {
      padding-right: 12px;
      padding-left: 46px;
    }
    [dir="rtl"] .auth-brand .logo-text-wrap {
      text-align: right !important;
    }
    [dir="rtl"] .auth-foot {
      text-align: center;
    }
  </style>
</head>
<body>
<!-- NO HEADER -->
<div class="auth-page-controls">
  <button class="icon-btn" data-rtl-toggle aria-label="Toggle RTL" style="font-family:var(--f-ui);font-size:0.65rem;font-weight:900;letter-spacing:0.02em;">RTL</button>
  <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"><i class="ri-sun-line"></i></button>
</div>
<main class="auth-page" style="padding:var(--s6) var(--s3);" role="main">
  <div class="auth-grid-bg"></div>
  <div class="auth-glow"></div>
  <div class="auth-card" style="max-width:460px" role="region" aria-labelledby="reg-title">
    <div class="auth-brand">
      <a href="../index.html" style="display:flex;flex-direction:row;align-items:center;gap:14px;text-decoration:none;" aria-label="Back to site">
        <div class="logo-mark" style="width:48px;height:48px;font-size:1.15rem;flex-shrink:0;">MG</div>
        <div class="logo-text-wrap"><span class="logo-name" style="font-size:1.4rem;">Modeler Game</span></div>
      </a>
      <div style="margin-top:var(--s2);"><h1 id="reg-title" style="font-size:1.6rem;margin-bottom:4px">Create Studio Account</h1><p style="font-size:.875rem;color:var(--c-text3)">Access the client dashboard &amp; asset pipeline</p></div>
    </div>
    <form id="register-form" data-v novalidate aria-label="Registration form">
        <div class="form-group"><label for="rn">Full Name <span style="color:var(--c-red)">*</span></label><input type="text" id="rn" class="form-ctrl" placeholder="" data-r="required" required autocomplete="name"/><span class="form-err" role="alert"></span></div>
              <div class="form-group"><label for="rs">Studio Name</label><input type="text" id="rs" class="form-ctrl" placeholder="" autocomplete="organization"/></div>

      <div class="form-group"><label for="re">Email Address <span style="color:var(--c-red)">*</span></label><input type="email" id="re" class="form-ctrl" placeholder="" data-r="required,email" required autocomplete="email"/><span class="form-err" role="alert"></span></div>
      <div class="form-group">
        <label for="rp">Password <span style="color:var(--c-red)">*</span></label>
        <div class="pw-wrap"><input type="password" id="rp" class="form-ctrl" placeholder="Create a strong password" data-r="required,password" required autocomplete="new-password"/><button type="button" class="pw-eye" data-eye="rp" aria-label="Toggle password"><i class="ri-eye-line"></i></button></div>
        <span class="form-err" role="alert"></span>
      </div>
      <div class="form-group">
        <label for="rc">Confirm Password <span style="color:var(--c-red)">*</span></label>
        <div class="pw-wrap"><input type="password" id="rc" class="form-ctrl" placeholder="Repeat your password" data-r="required" required autocomplete="new-password"/><button type="button" class="pw-eye" data-eye="rc" aria-label="Toggle confirm password"><i class="ri-eye-line"></i></button></div>
        <span class="form-err" role="alert"></span>
      </div>
      <div class="checkbox-row" style="margin-bottom:8px"><input type="checkbox" id="terms" required aria-required="true"/><label for="terms">I agree to <a href="#" style="color:var(--c-cyan)">Terms of Service</a> and <a href="#" style="color:var(--c-cyan)">Privacy Policy</a> <span style="color:var(--c-red)">*</span></label></div>
      <div class="checkbox-row" style="margin-bottom:var(--s3)"><input type="checkbox" id="nl-opt"/><label for="nl-opt">Send me project updates</label></div>
      <button type="submit" class="btn btn-cyan btn-full"><i class="ri-user-add-line"></i> Create Account</button>
    </form>
    <div class="auth-divider"><span>or sign up with</span></div>
    
<button class="oauth-btn" type="button" aria-label="Continue with Google">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn" type="button" aria-label="Continue with Apple">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      Continue with Apple
    </button>
    <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</main>
<script src="../assets/js/main.js"></script>
</body></html>
